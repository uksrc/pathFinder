name: Release pathfinder-http

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  release-http:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: ${{ !env.ACT }}

      - name: Extract version from http-server Cargo.toml
        id: cargo_version
        run: |
          CARGO_VERSION=$(grep -m1 "^version" crates/http-server/Cargo.toml | cut -d '"' -f2)
          echo "version=$CARGO_VERSION" >> $GITHUB_OUTPUT
          echo "http-server Cargo.toml version: $CARGO_VERSION"

      - name: Validate tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=${{ steps.cargo_version.outputs.version }}

          echo "Tag version: v$TAG_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"

          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "❌ Error: Tag version (v$TAG_VERSION) does not match crates/http-server/Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi

          echo "✓ Version check passed: Tag and Cargo.toml versions match"

      - name: Build pathfinder-http for Linux
        run: cargo build --release --bin pathfinder-http --target x86_64-unknown-linux-gnu --verbose

      - name: Install Ruby and FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: Create pathfinder-http RPM package
        run: |
          mkdir -p package/usr/bin \
                   package/usr/lib/systemd/system \
                   package/etc/default \
                   package/var/lib/pathfinder-http

          cp target/x86_64-unknown-linux-gnu/release/pathfinder-http package/usr/bin/
          chmod +x package/usr/bin/pathfinder-http

          cp packaging/http/pathfinder-http.service package/usr/lib/systemd/system/
          cp packaging/http/pathfinder-http.env package/etc/default/pathfinder-http

          fpm -s dir -t rpm \
            -n pathfinder-http \
            -v ${{ steps.cargo_version.outputs.version }} \
            --iteration 1 \
            --architecture x86_64 \
            --description "pathfinder HTTP server daemon" \
            --url "https://github.com/uksrc/pathFinder" \
            --license "BSD-3-Clause" \
            --after-install packaging/http/rpm-postinstall.sh \
            --before-remove packaging/http/rpm-preremove.sh \
            -C package \
            usr/bin/pathfinder-http \
            usr/lib/systemd/system/pathfinder-http.service \
            etc/default/pathfinder-http \
            var/lib/pathfinder-http

      - name: Upload RPM artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: pathfinder-http-rpm
          path: "*.rpm"

      - name: Upload pathfinder-http binary artifact
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: pathfinder-http-linux-x64
          path: target/x86_64-unknown-linux-gnu/release/pathfinder-http

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.rpm
            target/x86_64-unknown-linux-gnu/release/pathfinder-http
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
