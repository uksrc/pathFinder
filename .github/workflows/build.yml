name: Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate CHANGELOG has Unreleased section
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! grep -q "^## \[Unreleased\]" CHANGELOG.md; then
            echo "❌ Error: CHANGELOG.md has no '## [Unreleased]' section"
            exit 1
          fi
          echo "✓ CHANGELOG.md has an Unreleased section"

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: ${{ !env.ACT }}
      - name: Update files for release
        id: update_release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          CARGO_VERSION=$(grep -m1 "^version" Cargo.toml | cut -d '"' -f2)
          DATE=$(date +%Y-%m-%d)
          echo "Tag version: ${TAG_VERSION}"
          echo "Git branch contains: $(git branch --contains v${TAG_VERSION})"
          BRANCH=$(git branch --contains "v${TAG_VERSION}" | head -1 | sed 's|.*origin/||' | xargs)
          echo "Pushing release updates to branch: ${BRANCH}"

          if [[ "$CARGO_VERSION" != "$TAG_VERSION" ]]; then
            echo "Updating Cargo.toml version from ${CARGO_VERSION} to ${TAG_VERSION}"
            sed -i "s/^version = \"${CARGO_VERSION}\"/version = \"${TAG_VERSION}\"/" Cargo.toml
            git add Cargo.toml
          fi

          sed -i "s/## \[Unreleased\]/## v${TAG_VERSION} - ${DATE}/" CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: update files for v${TAG_VERSION}"
          git push origin HEAD:refs/heads/${BRANCH}
          echo "version=${TAG_VERSION}" >> $GITHUB_OUTPUT

      - name: Build for Linux
        run: cargo build --release --target x86_64-unknown-linux-gnu --verbose

      - name: Install Ruby and FPM
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm
          sudo gem install --no-document fpm

      - name: Create RPM package
        run: |
          mkdir -p package/usr/bin
          cp target/x86_64-unknown-linux-gnu/release/pathFinder package/usr/bin/
          chmod +x package/usr/bin/pathFinder

          fpm -s dir -t rpm \
            -n pathfinder \
            -v ${{ steps.update_release.outputs.version }} \
            --iteration 1 \
            --description "SKA path finder tool for locating and mounting data from SKA storage systems" \
            --url "https://github.com/ska-telescope/pathfinder" \
            --license "BSD-3-Clause" \
            -C package \
            usr/bin/pathFinder

      - name: Upload RPM package
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: pathfinder-rpm
          path: "*.rpm"

      - name: Upload Linux binary
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: pathfinder-linux-x64
          path: target/x86_64-unknown-linux-gnu/release/pathFinder

      - name: Upload artifacts to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *.rpm
            target/x86_64-unknown-linux-gnu/release/pathFinder
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
