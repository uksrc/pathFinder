[package]
name = "pathFinder"
version = "1.0.2"
edition = "2021"

[[bin]]
name = "pathFinder"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
regex = "1.10"
dirs = "5.0"
libc = "0.2"
users = "0.11.0"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
