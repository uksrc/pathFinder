[package]
name = "pathfinder-cli"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "pathfinder-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
pathfinder-shared = { path = "../shared" }
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.40", features = ["macros", "rt"] }
tracing = "0.1"
