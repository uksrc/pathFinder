[package]
name = "pathfinder-shared"
version = "2.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
axum-core = "0.5"
axum-jwt-auth = "0.7.0"
# Two jsonwebtoken versions: 11.x is used by the crate-internal helpers, while
# 10.3 matches the version re-exported by `axum-jwt-auth 0.7` so that the
# shared JWKS decoder produces the token types that the `Claims` extractor
# (HTTP server) and the `RemoteJwksAuth` validator below both understand.
jsonwebtoken_10 = { package = "jsonwebtoken", version = "10.3" }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
jsonwebtoken = "11.0.0"
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = [
  "sqlite",
  "runtime-tokio",
  "macros",
  "chrono",
  "uuid",
  "json",
] }
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
users = "0.11.0"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
