[package]
name = "pathfinder-shared"
version = "2.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
dirs = "5.0"
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
users = "0.11.0"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
