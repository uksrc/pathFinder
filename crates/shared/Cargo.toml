[package]
name = "pathfinder-shared"
version = "2.0.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
jsonwebtoken = "11.0.0"
regex = "1.10"
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9.0", features = [
  "sqlite",
  "runtime-tokio",
  "macros",
  "chrono",
  "uuid",
  "json",
] }
thiserror = "1.0"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
users = "0.11.0"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
